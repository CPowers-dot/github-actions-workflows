name: Daily proposal sender

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Debug secret length
        env:
          S: ${{ secrets.CRON_SECRET }}
        run: echo "secret length is ${#S}"
      - name: Call cron-send in a loop until today's quota is done
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            echo "--- attempt $i ---"
            resp=$(curl -s -w $'\n%{http_code}' -X GET "https://api-service-roan.vercel.app/api/cron-send" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" || true)
            code=$(echo "$resp" | tail -n1)
            body=$(echo "$resp" | sed '$d')
            echo "HTTP $code"
            echo "$body"
            if [ "$code" != "200" ]; then
              echo "Non-200 response, stopping for today."
              break
            fi
            remaining=$(echo "$body" | jq -r '.remaining // 0')
            echo "remaining: $remaining"
            if [ "$remaining" -le 0 ]; then
              echo "Today's quota is done."
              break
            fi
            sleep 5
          done
